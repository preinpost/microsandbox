name: Release Windows

on:
  workflow_call:
    inputs:
      target:
        description: Release target label.
        required: true
        type: string
      runner:
        description: GitHub Actions runner label.
        required: true
        type: string
      rust_target:
        description: Rust target triple.
        required: true
        type: string
      firmware_artifact:
        description: Matching kernel bundle artifact.
        required: true
        type: string
      agentd_artifact:
        description: Matching musl agentd artifact.
        required: true
        type: string
      vs_arch:
        description: MSVC target architecture.
        required: true
        type: string
      vs_host_arch:
        description: MSVC host architecture.
        required: true
        type: string
      msb_asset:
        description: Public release asset name for msb.
        required: true
        type: string
      libkrunfw_asset:
        description: Public release asset name for libkrunfw.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_INCREMENTAL: "0"
  LIBKRUNFW_ABI: "5"

jobs:
  runtime:
    name: Runtime (${{ inputs.target }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout libkrunfw sources
        shell: pwsh
        run: git submodule update --init --depth 1 vendor/libkrunfw

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ inputs.rust_target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true
          shared-key: release-runtime-${{ inputs.target }}

      - name: Download kernel bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.firmware_artifact }}
          path: vendor/libkrunfw/

      - name: Download agentd
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.agentd_artifact }}
          path: build/

      - name: Build libkrunfw.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\vendor\libkrunfw\scripts\build-windows.ps1 `
            -SkipKernelBundle `
            -AbiVersion ${{ env.LIBKRUNFW_ABI }} `
            -Architecture ${{ inputs.vs_arch }} `
            -HostArchitecture ${{ inputs.vs_host_arch }} `
            -Output libkrunfw.dll `
            -ImportLibrary libkrunfw.lib
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Copy-Item vendor\libkrunfw\libkrunfw.dll build\libkrunfw.dll -Force

      - name: Build msb
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\vendor\libkrunfw\scripts\msvc-env.ps1"
          Set-MsvcEnvironment -Architecture ${{ inputs.vs_arch }} -HostArchitecture ${{ inputs.vs_host_arch }}
          cargo build --release --no-default-features --features embed-binaries,net,ssh -p microsandbox-cli --target ${{ inputs.rust_target }}
          Copy-Item target\${{ inputs.rust_target }}\release\msb.exe build\msb.exe -Force
          & build\msb.exe --version

      - name: Smoke test installed runtime discovery
        shell: pwsh
        run: python scripts/smoke/cli/runtime-discovery.py --msb build/msb.exe --libkrunfw build/libkrunfw.dll

      - name: Stage platform artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts, bundle\archive | Out-Null
          Copy-Item build\msb.exe artifacts\${{ inputs.msb_asset }} -Force
          Copy-Item build\libkrunfw.dll artifacts\${{ inputs.libkrunfw_asset }} -Force
          Copy-Item build\msb.exe bundle\archive\msb.exe -Force
          Copy-Item build\libkrunfw.dll bundle\archive\libkrunfw.dll -Force
          Compress-Archive -Path bundle\archive\msb.exe, bundle\archive\libkrunfw.dll -DestinationPath artifacts\microsandbox-${{ inputs.target }}.zip -Force
          tar.exe -czf artifacts\microsandbox-${{ inputs.target }}.tar.gz -C bundle\archive msb.exe libkrunfw.dll

      - name: Upload platform artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.target }}
          path: artifacts/
          compression-level: 0
