name: Release macOS

on:
  workflow_call:
    inputs:
      target:
        description: Release target label.
        required: true
        type: string
      runner:
        description: GitHub Actions runner label.
        required: true
        type: string
      os:
        description: Operating-system family (linux or darwin).
        required: true
        type: string
      arch:
        description: Release architecture label.
        required: true
        type: string
      agentd_artifact:
        description: Matching musl agentd artifact.
        required: true
        type: string
      firmware_artifact:
        description: Matching kernel/libkrunfw producer artifact.
        required: true
        type: string
      libkrunfw_file:
        description: Canonical runtime library filename.
        required: true
        type: string
      libkrunfw_asset:
        description: Public release asset name for libkrunfw.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_INCREMENTAL: "0"
  LIBKRUNFW_VERSION: "5.6.1"
  LIBKRUNFW_ABI: "5"

jobs:
  runtime:
    name: Runtime (${{ inputs.target }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true
          shared-key: release-runtime-${{ inputs.target }}

      - name: Download agentd
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.agentd_artifact }}
          path: build/

      - name: Download firmware
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.firmware_artifact }}
          path: firmware/

      - name: Build libkrunfw (macOS)
        if: inputs.os == 'darwin'
        run: |
          mkdir -p build
          cc -fPIC -DABI_VERSION=${{ env.LIBKRUNFW_ABI }} -shared \
            -o build/${{ inputs.libkrunfw_file }} firmware/kernel.c
          ln -sf ${{ inputs.libkrunfw_file }} build/libkrunfw.dylib

      - name: Build msb
        run: |
          cargo build --release --no-default-features --features embed-binaries,net,ssh -p microsandbox-cli
          cp target/release/msb build/msb

      - name: Codesign msb (macOS)
        if: inputs.os == 'darwin'
        run: codesign --entitlements msb-entitlements.plist --force -s - build/msb

      - name: Verify runtime binary
        run: build/msb --version

      - name: Smoke test installed runtime discovery
        run: |
          python3 scripts/smoke/cli/runtime-discovery.py \
            --msb build/msb --libkrunfw build/${{ inputs.libkrunfw_file }}

      - name: Stage platform artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          chmod 755 build/msb
          cp build/msb artifacts/msb-${{ inputs.target }}
          cp build/${{ inputs.libkrunfw_file }} artifacts/${{ inputs.libkrunfw_asset }}
          tar -czf artifacts/microsandbox-${{ inputs.target }}.tar.gz \
            -C build msb ${{ inputs.libkrunfw_file }}

      - name: Upload platform artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.target }}
          path: artifacts/
          compression-level: 0
