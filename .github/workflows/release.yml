name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_INCREMENTAL: "0"
  LIBKRUNFW_VERSION: "5.6.1"
  LIBKRUNFW_ABI: "5"

permissions:
  contents: read

jobs:
  kernel-sources:
    name: Kernel sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout libkrunfw sources
        run: git submodule update --init --depth 1 vendor/libkrunfw

      - name: Prepare kernel source
        uses: ./.github/actions/cache-libkrunfw-kernel

      - name: Upload kernel source archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-source
          path: vendor/libkrunfw/tarballs/*.tar.gz
          compression-level: 0

  firmware-aarch64:
    name: Firmware (aarch64)
    needs: kernel-sources
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout libkrunfw sources
        run: git submodule update --init --depth 1 vendor/libkrunfw

      - name: Cache firmware
        id: cache-firmware
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor/libkrunfw/kernel.c
            vendor/libkrunfw/libkrunfw.so.${{ env.LIBKRUNFW_VERSION }}
          key: release-firmware-aarch64-${{ hashFiles('vendor/libkrunfw/**') }}

      - name: Install firmware build dependencies
        if: steps.cache-firmware.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev gcc make flex bison libelf-dev bc python3-pyelftools

      - name: Download kernel source archive
        if: steps.cache-firmware.outputs.cache-hit != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-source
          path: vendor/libkrunfw/tarballs

      - name: Build firmware
        if: steps.cache-firmware.outputs.cache-hit != 'true'
        working-directory: vendor/libkrunfw
        run: make -j$(nproc)

      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-aarch64
          path: |
            vendor/libkrunfw/kernel.c
            vendor/libkrunfw/libkrunfw.so.${{ env.LIBKRUNFW_VERSION }}
          compression-level: 0

  firmware-x86_64:
    name: Firmware (${{ matrix.host }} x86_64)
    needs: kernel-sources
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Linux
            artifact: firmware-x86_64
            make_args: ""
          - host: Windows
            artifact: firmware-windows-x86_64
            make_args: OS=Windows kernel.c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout libkrunfw sources
        run: git submodule update --init --depth 1 vendor/libkrunfw

      - name: Cache firmware
        id: cache-firmware
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor/libkrunfw/kernel.c
            vendor/libkrunfw/libkrunfw.so.${{ env.LIBKRUNFW_VERSION }}
          key: release-${{ matrix.artifact }}-${{ hashFiles('vendor/libkrunfw/**') }}

      - name: Install firmware build dependencies
        if: steps.cache-firmware.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev gcc make flex bison libelf-dev bc python3-pyelftools

      - name: Download kernel source archive
        if: steps.cache-firmware.outputs.cache-hit != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-source
          path: vendor/libkrunfw/tarballs

      - name: Build firmware
        if: steps.cache-firmware.outputs.cache-hit != 'true'
        working-directory: vendor/libkrunfw
        run: make -j$(nproc) ${{ matrix.make_args }}

      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            vendor/libkrunfw/kernel.c
            vendor/libkrunfw/libkrunfw.so.${{ env.LIBKRUNFW_VERSION }}
          compression-level: 0

  agentd-aarch64:
    name: Agentd (aarch64-linux-musl)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true
          shared-key: release-agentd-aarch64

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build agentd
        run: cargo build --release --manifest-path crates/agentd/Cargo.toml --target aarch64-unknown-linux-musl

      - name: Upload agentd
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentd-aarch64-linux-musl
          path: target/aarch64-unknown-linux-musl/release/agentd
          compression-level: 0

  agentd-x86_64:
    name: Agentd (x86_64-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true
          shared-key: release-agentd-x86_64

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build agentd
        run: cargo build --release --manifest-path crates/agentd/Cargo.toml --target x86_64-unknown-linux-musl

      - name: Upload agentd
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentd-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/agentd
          compression-level: 0

  linux-x86_64:
    name: Linux x86_64
    needs: [firmware-x86_64, agentd-x86_64]
    uses: ./.github/workflows/release-linux.yml
    with:
      target: linux-x86_64
      runner: ubuntu-latest
      manylinux_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b
      arch: x86_64
      agentd_artifact: agentd-x86_64-linux-musl
      firmware_artifact: firmware-x86_64
      libkrunfw_file: libkrunfw.so.5.6.1
      libkrunfw_asset: libkrunfw-linux-x86_64.so

  linux-aarch64:
    name: Linux aarch64
    needs: [firmware-aarch64, agentd-aarch64]
    uses: ./.github/workflows/release-linux.yml
    with:
      target: linux-aarch64
      runner: ubuntu-24.04-arm
      manylinux_image: quay.io/pypa/manylinux_2_28_aarch64@sha256:561427136aabf3787bffb294b3515748241e0962d1527ae28bea1e076bfb9d99
      arch: aarch64
      agentd_artifact: agentd-aarch64-linux-musl
      firmware_artifact: firmware-aarch64
      libkrunfw_file: libkrunfw.so.5.6.1
      libkrunfw_asset: libkrunfw-linux-aarch64.so

  darwin-aarch64:
    name: macOS aarch64
    needs: [firmware-aarch64, agentd-aarch64]
    uses: ./.github/workflows/release-macos.yml
    with:
      target: darwin-aarch64
      runner: macos-14
      os: darwin
      arch: aarch64
      agentd_artifact: agentd-aarch64-linux-musl
      firmware_artifact: firmware-aarch64
      libkrunfw_file: libkrunfw.5.dylib
      libkrunfw_asset: libkrunfw-darwin-aarch64.dylib

  windows-x86_64:
    name: Windows x86_64
    needs: [firmware-x86_64, agentd-x86_64]
    uses: ./.github/workflows/release-windows.yml
    with:
      target: windows-x86_64
      runner: windows-latest
      rust_target: x86_64-pc-windows-msvc
      firmware_artifact: firmware-windows-x86_64
      agentd_artifact: agentd-x86_64-linux-musl
      vs_arch: amd64
      vs_host_arch: amd64
      msb_asset: msb-windows-x86_64.exe
      libkrunfw_asset: libkrunfw-windows-x86_64.dll

  assemble:
    name: Assemble Release
    needs:
      - linux-x86_64
      - linux-aarch64
      - darwin-aarch64
      - windows-x86_64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Copy install script
        if: hashFiles('scripts/install.sh') != ''
        run: cp scripts/install.sh release-artifacts/install.sh

      - name: Copy Windows install script
        if: hashFiles('scripts/install.ps1') != ''
        run: cp scripts/install.ps1 release-artifacts/install.ps1

      - name: Generate checksums
        working-directory: release-artifacts
        run: sha256sum * > checksums.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "${{ github.ref_name }}" =~ -(rc|alpha|beta|dev) ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release delete "${{ github.ref_name }}" --yes || true
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Patched v0.7.8 runtime release with nested virtualization enabled." \
            $PRERELEASE \
            release-artifacts/*
